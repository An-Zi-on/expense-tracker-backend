spring:
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB
  jackson:
    # Jackson 3 中 WRITE_DATES_AS_TIMESTAMPS 已迁到 DateTimeFeature，
    # 不能再写在 serialization 下，改由 JacksonConfiguration 以代码关闭。
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  application:
    name: common-template
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/an_project
    username: root
    password: 20030517
server:
  port: 8123
  servlet:
    context-path: /api
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDelete
      logic-delete-value: 1
      logic-not-delete-value: 0

# 接口文档：Spring Boot 4 使用 springdoc-openapi 3.x + knife4j 5.x
# 访问 http://localhost:8123/api/doc.html
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  group-configs:
    - group: default
      packages-to-scan: anzihe.com.common_template.controller

knife4j:
  enable: true
  setting:
    language: zh_cn

# 本地头像上传目录（相对运行目录）
app:
  upload:
    dir: uploads
    max-size-mb: 2

jwt:
  secret: template
  expire-minutes: 30
  issuer: template
